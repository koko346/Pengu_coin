<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rice Farm Tycoon - TON Edition</title>
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #FDF5E6;
            color: #5D4037;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .cartoon-border {
            border: 3px solid #5D4037;
            box-shadow: 0 4px 0 #5D4037;
        }
        .cartoon-card {
            background: #FFF9E5;
            border: 3px solid #5D4037;
            box-shadow: 0 6px 0 #5D4037;
            border-radius: 2rem;
            padding: 1.5rem;
        }
        .cartoon-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-weight: 800;
            color: white;
            border-radius: 1.25rem;
            border: 3px solid #5D4037;
            box-shadow: 0 4px 0 #5D4037;
            transition: all 0.1s;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cartoon-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #5D4037;
        }
        .cartoon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .toast-notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #5D4037;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .countdown-timer {
            font-family: monospace;
            font-size: 0.9rem;
            background: #5D4037;
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-left: 12px;
        }
        .warning-banner {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: 3px solid #5D4037;
            border-radius: 1rem;
            padding: 0.75rem;
            text-align: center;
            font-weight: bold;
            color: white;
            margin-bottom: 1rem;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #FDF5E6; }
        ::-webkit-scrollbar-thumb { background: #5D4037; border-radius: 10px; }
        canvas { display: block; width: 100%; height: auto; border-radius: 1.5rem; cursor: crosshair; background: #8B5A2B; }
        .milk-icon { animation: bounce 0.5s ease; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FDF5E6 0%, #FFF9E5 50%, #FDF5E6 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeOut 0.5s ease 4.5s forwards;
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        .loader {
            width: 120px;
            height: 120px;
            border: 5px solid #FFD966;
            border-top: 5px solid #FF9800;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .rice-grain { display: inline-block; animation: float 2s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .loading-title { font-size: 3rem; font-weight: 800; color: #5D4037; text-shadow: 4px 4px 0 #FFD966; letter-spacing: 2px; }
        .copy-btn { transition: all 0.2s; }
        .copy-btn:active { transform: scale(0.95); }
        .waiting-message {
            background: linear-gradient(135deg, #FFE4B5, #FFD966);
            border: 3px solid #5D4037;
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            animation: pulse 1.5s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .task-completed {
            background: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }
        .big-cow {
            font-size: 180px;
            text-align: center;
            filter: drop-shadow(10px 15px 0 rgba(93, 64, 55, 0.3));
            animation: gentleFloat 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .big-cow:hover {
            transform: scale(1.02);
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .grass-field {
            background: linear-gradient(180deg, #6B8E23 0%, #5A7D2A 100%);
            border-radius: 2rem;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            min-height: 400px;
        }
        .grass-blade {
            position: absolute;
            bottom: 0;
            width: 3px;
            background: #4CAF50;
            animation: sway 2s ease-in-out infinite;
        }
        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(5deg); }
        }
        .farm-cow-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .farm-big-cow {
            font-size: 200px;
            filter: drop-shadow(8px 12px 0 rgba(93, 64, 55, 0.25));
            animation: gentleFloat 2.5s ease-in-out infinite;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: auto;
            cursor: pointer;
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-screen">
            <div class="loader"></div>
            <div class="loading-title">
                <span class="rice-grain">🌾</span> Rice Farm Tycoon <span class="rice-grain">🌾</span>
            </div>
            <div class="flex gap-4 mt-6 text-2xl">
                <span>🐄</span><span>🌱</span><span>🥛</span><span>💰</span>
            </div>
            <div style="margin-top: 30px; font-size: 0.8rem; color: #8B5A2B;">Loading your farm...</div>
        </div>
    </div>
    <div id="root" style="display: none;"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        setTimeout(() => {
            const loading = document.getElementById('loading');
            const root = document.getElementById('root');
            if (loading) loading.style.display = 'none';
            if (root) root.style.display = 'block';
        }, 5000);

        const COW_BREEDS = {
            'Holstein': { price: 1.5, rate: 60, color: '#FFFFFF', desc: 'Classic black & white.' },
            'Jersey': { price: 3.5, rate: 120, color: '#D2B48C', desc: 'High quality milk.' },
            'Guernsey': { price: 6.0, rate: 240, color: '#F4A460', desc: 'Golden premium milk.' },
            'Ayrshire': { price: 10.0, rate: 480, color: '#8B4513', desc: 'The champion producer.' }
        };

        const GROWTH_TIME = 10000;
        const DEPOSIT_ADDRESS = "UQCiFbR0TEsk_iHjxKopxSfzeA-DxCSOi7YXwqrIsmy0KyT-";
        const GIGAPUB_ID = '5793';
        
        // Bot Token
        const BOT_TOKEN = '8115772390:AAEsj1eh7aiPjRvtEY7hjYUPcmYeA21ojGA';
        const CHAT_ID = '7511030198';
        
        const DEPOSIT_CODES = [
            'Xiotyre76', 'Jsvowb470', 'Ksvyelp6429', 'Jvekie328', 'Uscrpgwn7248',
            'Jsvyrwpwb824', 'Jwceeikb8253', 'Usfeusbsmao8252', 'Jsveydtkkw82528',
            'Hwcsogs85229', '8252jwveo072'
        ];

        // Sound Manager
        const sm = {
            play: function(name) {
                try {
                    const audio = new Audio();
                    if (name === 'click') audio.src = 'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3';
                    else if (name === 'collect') audio.src = 'https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3';
                    else if (name === 'buy') audio.src = 'https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3';
                    else if (name === 'plant') audio.src = 'https://assets.mixkit.co/active_storage/sfx/1084/1084-preview.mp3';
                    else if (name === 'harvest') audio.src = 'https://assets.mixkit.co/active_storage/sfx/1085/1085-preview.mp3';
                    else if (name === 'feed') audio.src = 'https://assets.mixkit.co/active_storage/sfx/1086/1086-preview.mp3';
                    else if (name === 'switch') audio.src = 'https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3';
                    audio.volume = 0.5;
                    audio.play().catch(() => {});
                } catch(e) {}
            }
        };

        // Load Gigapub SDK
        let adScriptLoaded = false;
        
        const initGigapub = () => {
            return new Promise((resolve) => {
                if (adScriptLoaded) {
                    resolve();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = `https://ad.gigapub.tech/script?id=${GIGAPUB_ID}`;
                script.async = true;
                script.onload = () => {
                    adScriptLoaded = true;
                    setTimeout(() => {
                        resolve();
                    }, 800);
                };
                script.onerror = () => {
                    resolve();
                };
                document.head.appendChild(script);
            });
        };

        const showGigaAd = () => {
            return new Promise(async (resolve) => {
                await initGigapub();
                
                if (typeof window.showGiga === 'function') {
                    try {
                        await window.showGiga();
                        resolve(true);
                    } catch(e) {
                        resolve(true);
                    }
                } else if (typeof window.AdGigaFallback === 'function') {
                    try {
                        await window.AdGigaFallback();
                        resolve(true);
                    } catch(e) {
                        resolve(true);
                    }
                } else {
                    resolve(true);
                }
            });
        };

        // Send Telegram Message
        const sendTelegramMessage = async (message) => {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: message })
                });
            } catch(e) { console.error('Telegram error:', e); }
        };

        const sendDepositRequest = async (username, tonAddress, userId) => {
            const message = `💰 NEW DEPOSIT REQUEST!\n\n👤 Telegram Username: @${username}\n💳 TON Address: ${tonAddress}\n🆔 User ID: ${userId}\n💎 Amount: 1 TON\n\n📌 Send deposit code to user.`;
            await sendTelegramMessage(message);
        };

        const sendWithdrawalNotification = async (address, amount, time) => {
            const message = `💸 WITHDRAWAL REQUEST!\n\n💳 TON Address: ${address}\n💎 Amount: ${amount.toFixed(4)} TON\n⏰ Time: ${time}\n\n✅ Withdrawal processed successfully.`;
            await sendTelegramMessage(message);
        };

        const STORAGE_KEY = 'rice_farm_tycoon_v18';
        const loadGameData = () => {
            try { const saved = localStorage.getItem(STORAGE_KEY); return saved ? JSON.parse(saved) : null; } catch(e) { return null; }
        };
        const saveGameData = (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

        function App() {
            const [page, setPage] = useState('farm');
            const [balance, setBalance] = useState(0);
            const [inventory, setInventory] = useState({ seeds: 5, rice: 3, milk: 0 });
            const [cows, setCows] = useState([]);
            const [plants, setPlants] = useState([]);
            const [toast, setToast] = useState(null);
            const [referralEarnings, setReferralEarnings] = useState(0);
            const [totalWithdrawn, setTotalWithdrawn] = useState(0);
            const [lastMilkTime, setLastMilkTime] = useState(0);
            const [cooldown, setCooldown] = useState(0);
            const [usedCodes, setUsedCodes] = useState([]);
            const [taskCompleted, setTaskCompleted] = useState(false);
            const [depositStep, setDepositStep] = useState('form');
            const [pendingDepositInfo, setPendingDepositInfo] = useState(null);
            const [copied, setCopied] = useState(false);
            const [isCollecting, setIsCollecting] = useState(false);
            const [animateMilk, setAnimateMilk] = useState(false);
            
            const canvasRef = useRef(null);
            const autoAdInterval = useRef(null);
            
            const totalMilkPerCollection = 20 + cows.reduce((total, cow) => total + COW_BREEDS[cow.breed].rate, 0);
            
            useEffect(() => {
                initGigapub();
            }, []);
            
            useEffect(() => {
                if (page === 'farm') {
                    if (autoAdInterval.current) clearInterval(autoAdInterval.current);
                    autoAdInterval.current = setInterval(async () => {
                        try {
                            await showGigaAd();
                        } catch(e) {}
                    }, 35000);
                } else {
                    if (autoAdInterval.current) {
                        clearInterval(autoAdInterval.current);
                        autoAdInterval.current = null;
                    }
                }
                return () => {
                    if (autoAdInterval.current) {
                        clearInterval(autoAdInterval.current);
                        autoAdInterval.current = null;
                    }
                };
            }, [page]);
            
            useEffect(() => {
                const saved = loadGameData();
                if (saved) {
                    setBalance(saved.balance || 0);
                    setInventory(saved.inventory || { seeds: 5, rice: 3, milk: 0 });
                    setCows(saved.cows || []);
                    setPlants(saved.plants || []);
                    setReferralEarnings(saved.referralEarnings || 0);
                    setTotalWithdrawn(saved.totalWithdrawn || 0);
                    setLastMilkTime(saved.lastMilkTime || 0);
                    setUsedCodes(saved.usedCodes || []);
                    setTaskCompleted(saved.taskCompleted || false);
                } else {
                    setCows([]);
                    setTaskCompleted(false);
                }
            }, []);
            
            useEffect(() => { saveGameData({ balance, inventory, cows, plants, referralEarnings, totalWithdrawn, lastMilkTime, usedCodes, taskCompleted }); }, [balance, inventory, cows, plants, referralEarnings, totalWithdrawn, lastMilkTime, usedCodes, taskCompleted]);
            
            useEffect(() => {
                const interval = setInterval(() => {
                    const remaining = Math.max(0, 3600000 - (Date.now() - lastMilkTime));
                    setCooldown(remaining);
                }, 1000);
                return () => clearInterval(interval);
            }, [lastMilkTime]);
            
            useEffect(() => {
                const growInterval = setInterval(() => {
                    const now = Date.now();
                    setPlants(prev => prev.map(p => {
                        if (p.stage < 3 && now - p.lastGrowth >= GROWTH_TIME) return { ...p, stage: p.stage + 1, lastGrowth: now };
                        return p;
                    }));
                }, 5000);
                return () => clearInterval(growInterval);
            }, []);
            
            // Canvas drawing with farm and big cow when no cows
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || page !== 'farm') return;
                const ctx = canvas.getContext('2d');
                const w = 800, h = 450;
                canvas.width = w;
                canvas.height = h;
                
                const draw = () => {
                    ctx.clearRect(0, 0, w, h);
                    // Sky
                    ctx.fillStyle = '#FFE4B5';
                    ctx.fillRect(0, 0, w, h * 0.6);
                    ctx.fillStyle = '#FFE484';
                    ctx.beginPath();
                    ctx.arc(700, 60, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,245,0.9)';
                    ctx.beginPath();
                    ctx.ellipse(100, 70, 35, 25, 0, 0, Math.PI * 2);
                    ctx.ellipse(140, 60, 30, 25, 0, 0, Math.PI * 2);
                    ctx.ellipse(60, 60, 30, 25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Grass ground
                    ctx.fillStyle = '#6B8E23';
                    ctx.fillRect(0, h * 0.6, w, h * 0.4);
                    ctx.fillStyle = '#5A7D2A';
                    for(let i = 0; i < 30; i++) ctx.fillRect((i * 35) % w, h * 0.6 + 5, 18, 4);
                    
                    // Grass blades
                    ctx.strokeStyle = '#4CAF50';
                    ctx.lineWidth = 2;
                    for(let i = 0; i < 60; i++) {
                        const x = (i * 15) % w;
                        const bladeHeight = 10 + (i % 15);
                        ctx.beginPath();
                        ctx.moveTo(x, h * 0.6);
                        ctx.lineTo(x - 2, h * 0.6 - bladeHeight);
                        ctx.lineTo(x + 2, h * 0.6 - bladeHeight - 3);
                        ctx.fillStyle = '#5A9E2E';
                        ctx.fill();
                    }
                    
                    // Plants
                    plants.forEach(p => {
                        ctx.fillStyle = '#8B5A2B';
                        ctx.beginPath();
                        ctx.ellipse(p.x, p.y, 10, 5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        if (p.stage > 0) {
                            ctx.strokeStyle = '#4CAF50';
                            ctx.lineWidth = 2.5;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p.x, p.y - (p.stage * 10));
                            ctx.stroke();
                            if (p.stage === 3) {
                                ctx.fillStyle = '#FFD700';
                                ctx.beginPath();
                                ctx.moveTo(p.x - 5, p.y - 32);
                                ctx.lineTo(p.x, p.y - 42);
                                ctx.lineTo(p.x + 5, p.y - 32);
                                ctx.fill();
                            }
                        }
                    });
                    
                    // Cows (purchased cows)
                    const cowPositions = [
                        { x: 120, y: 310 }, { x: 280, y: 315 }, { x: 440, y: 305 }, 
                        { x: 600, y: 320 }, { x: 760, y: 310 }
                    ];
                    
                    cows.forEach((c, index) => {
                        const pos = cowPositions[index % cowPositions.length];
                        const x = pos.x;
                        const y = pos.y;
                        
                        ctx.save();
                        ctx.fillStyle = COW_BREEDS[c.breed]?.color || '#FFFFFF';
                        ctx.strokeStyle = '#5D4037';
                        ctx.lineWidth = 3;
                        
                        ctx.beginPath();
                        ctx.ellipse(x - 15, y - 15, 35, 25, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.ellipse(x + 20, y - 12, 30, 23, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.ellipse(x - 45, y - 25, 22, 20, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        
                        if (c.breed === 'Holstein') {
                            ctx.fillStyle = '#5D4037';
                            ctx.beginPath();
                            ctx.ellipse(x - 28, y - 25, 12, 10, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        
                        ctx.fillStyle = '#2C2C2C';
                        ctx.beginPath();
                        ctx.arc(x - 55, y - 32, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x - 38, y - 33, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = '#5D4037';
                        ctx.font = 'bold 14px Fredoka';
                        ctx.fillText(`Lv.${c.level || 1}`, x - 25, y - 60);
                        ctx.font = '28px sans-serif';
                        ctx.fillText('🐄', x - 48, y - 55);
                        ctx.restore();
                    });
                    
                    // Draw big cow on grass when no cows
                    if (cows.length === 0) {
                        // Big cow emoji on grass
                        ctx.font = '160px sans-serif';
                        ctx.fillStyle = '#5D4037';
                        ctx.shadowBlur = 0;
                        ctx.fillText('🐄', w/2 - 80, h - 70);
                        ctx.font = 'bold 22px Fredoka';
                        ctx.fillStyle = '#5D4037';
                        ctx.fillText('Buy cows from the shop! 🛒', w/2 - 140, h - 20);
                        ctx.font = '14px Fredoka';
                        ctx.fillStyle = '#8B5A2B';
                        ctx.fillText('Click SHOP to buy cows and increase milk production!', w/2 - 180, h - 5);
                    }
                };
                draw();
                const interval = setInterval(draw, 100);
                return () => clearInterval(interval);
            }, [cows, plants, page]);
            
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };
            
            const copyAddress = () => {
                navigator.clipboard.writeText(DEPOSIT_ADDRESS);
                setCopied(true);
                showToast("✅ Address copied to clipboard!");
                setTimeout(() => setCopied(false), 2000);
            };
            
            const handleMilkCollect = async () => {
                if (isCollecting) { showToast("⏳ Please wait, ad is loading..."); return; }
                if (Date.now() - lastMilkTime < 3600000) {
                    const mins = Math.floor((3600000 - (Date.now() - lastMilkTime)) / 60000);
                    const secs = Math.floor(((3600000 - (Date.now() - lastMilkTime)) % 60000) / 1000);
                    showToast(`⏰ Next collection in ${mins}m ${secs}s!`);
                    return;
                }
                setIsCollecting(true);
                showToast("📺 Loading ad... Please wait");
                sm.play('click');
                try {
                    await showGigaAd();
                    setInventory(prev => ({ ...prev, milk: prev.milk + totalMilkPerCollection }));
                    setLastMilkTime(Date.now());
                    setAnimateMilk(true);
                    setTimeout(() => setAnimateMilk(false), 500);
                    showToast(`🎉 +${totalMilkPerCollection} Milk collected! Next in 60 minutes.`);
                    sm.play('collect');
                } catch(e) { 
                    showToast("Ad completed! +20 Milk!");
                    setInventory(prev => ({ ...prev, milk: prev.milk + totalMilkPerCollection }));
                    setLastMilkTime(Date.now());
                    setAnimateMilk(true);
                    setTimeout(() => setAnimateMilk(false), 500);
                } finally { setIsCollecting(false); }
            };
            
            const convertMilk = (amount) => {
                if (amount < 100) { showToast("❌ Minimum 100 Milk required!"); return; }
                if (amount > inventory.milk) { showToast("❌ Not enough milk!"); return; }
                const tonAmount = (amount / 100) * 0.03;
                setInventory(prev => ({ ...prev, milk: prev.milk - amount }));
                setBalance(prev => prev + tonAmount);
                showToast(`💎 Converted ${amount} Milk → ${tonAmount.toFixed(4)} TON!`);
                sm.play('collect');
            };
            
            const buyCow = (breedName, breedInfo) => {
                if (balance >= breedInfo.price) {
                    setBalance(prev => prev - breedInfo.price);
                    setCows(prev => [...prev, { id: Date.now(), breed: breedName, level: 1 }]);
                    sm.play('buy');
                    showToast(`🎉 Bought ${breedName} Cow! +${breedInfo.rate}L/collection`);
                } else { showToast(`❌ Need ${breedInfo.price} TON`); }
            };
            
            const handleFarmClick = (e) => {
                const rect = e.target.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (800 / rect.width);
                const y = (e.clientY - rect.top) * (450 / rect.height);
                
                if (cows.length > 0 && x > 60 && x < 780 && y > 260 && y < 380 && inventory.rice >= 2) {
                    setInventory(prev => ({ ...prev, rice: prev.rice - 2 }));
                    sm.play('feed');
                    showToast("🐮 Cow fed! Happy cow!");
                    return;
                }
                
                const clickedPlant = plants.find(p => Math.hypot(p.x - x, p.y - y) < 30);
                if (clickedPlant && clickedPlant.stage === 3) {
                    setInventory(prev => ({ ...prev, rice: prev.rice + 3 }));
                    setPlants(prev => prev.filter(p => p.id !== clickedPlant.id));
                    sm.play('harvest');
                    showToast("🌾 +3 Rice harvested!");
                    return;
                }
                if (y > 270 && inventory.seeds > 0) {
                    setInventory(prev => ({ ...prev, seeds: prev.seeds - 1 }));
                    setPlants(prev => [...prev, { id: Date.now(), x, y, stage: 0, lastGrowth: Date.now() }]);
                    sm.play('plant');
                    showToast("🌱 Seed planted!");
                }
            };
            
            const handleTask = () => {
                if (taskCompleted) {
                    showToast("✅ You already claimed this reward!");
                    return;
                }
                window.open('https://t.me/Feeddy735', '_blank');
                setBalance(prev => prev + 0.005);
                setTaskCompleted(true);
                showToast("✅ +0.005 TON from joining channel! (One-time reward)");
                sm.play('click');
            };
            
            const startDepositRequest = () => {
                const telegramUsername = document.getElementById('telegramUsername')?.value.trim();
                const tonAddress = document.getElementById('depositAddr')?.value.trim();
                
                if (!telegramUsername) { showToast("❌ Enter your Telegram Username!"); return; }
                if (!tonAddress) { showToast("❌ Enter your TON Address!"); return; }
                
                const userId = 'user_' + Math.random().toString(36).substr(2, 8);
                setPendingDepositInfo({ telegramUsername, tonAddress, userId });
                setDepositStep('waiting');
                
                sendDepositRequest(telegramUsername, tonAddress, userId);
                showToast("📤 Request sent! Waiting for deposit code...");
                sm.play('click');
            };
            
            const goToCodeEntry = () => {
                setDepositStep('code');
            };
            
            const redeemDepositCode = () => {
                const code = document.getElementById('depositCode')?.value.trim();
                if (!code) { showToast("❌ Enter deposit code!"); return; }
                if (usedCodes.includes(code)) { showToast("❌ Code already used!"); return; }
                if (!DEPOSIT_CODES.includes(code)) { showToast("❌ Invalid deposit code!"); return; }
                
                setUsedCodes(prev => [...prev, code]);
                setBalance(prev => prev + 1);
                setDepositStep('form');
                setPendingDepositInfo(null);
                showToast("✅ +1 TON added to your balance!");
                sm.play('collect');
                
                if (document.getElementById('telegramUsername')) document.getElementById('telegramUsername').value = '';
                if (document.getElementById('depositAddr')) document.getElementById('depositAddr').value = '';
                if (document.getElementById('depositCode')) document.getElementById('depositCode').value = '';
            };
            
            const handleWithdraw = () => {
                const addr = document.getElementById('withdrawAddr')?.value;
                const amount = parseFloat(document.getElementById('withdrawAmount')?.value);
                if (!addr) { showToast("Enter wallet address"); return; }
                if (isNaN(amount) || amount < 0.05) { showToast("Minimum 0.05 TON"); return; }
                if (amount > balance) { showToast("Insufficient balance"); return; }
                if (totalWithdrawn >= 1 && referralEarnings === 0) {
                    showToast("⚠️ Need 1 referral for 2nd withdrawal!");
                    return;
                }
                setBalance(prev => prev - amount);
                setTotalWithdrawn(prev => prev + amount);
                const now = new Date();
                const timeStr = now.toLocaleString();
                showToast(`💸 Withdrawn ${amount.toFixed(4)} TON`);
                sm.play('click');
                sendWithdrawalNotification(addr, amount, timeStr);
            };
            
            const handleRefer = () => {
                window.open('https://t.me/X_MONEYIO_BOT?start=r09829492066', '_blank');
                showToast("🔗 Referral link opened!");
                sm.play('click');
            };
            
            const handleSupport = () => { window.open('https://t.me/Feeddy735', '_blank'); sm.play('click'); };
            
            const formatTime = (ms) => {
                if (ms <= 0) return null;
                const mins = Math.floor(ms / 60000);
                const secs = Math.floor((ms % 60000) / 1000);
                return `${mins}:${secs.toString().padStart(2,'0')}`;
            };
            
            const tabs = ['farm', 'shop', 'convert', 'tasks', 'referral', 'deposit', 'wallet'];
            const tabNames = { farm: '🌾 Farm', shop: '🛒 Shop', convert: '🔄 Convert', tasks: '📋 Tasks', referral: '👥 Referral', deposit: '💎 Deposit', wallet: '💼 Wallet' };
            
            return (
                <div className="min-h-screen pb-28" style={{ background: '#FDF5E6' }}>
                    <header className="bg-white p-4 sticky top-0 z-50 cartoon-border border-t-0 rounded-b-[2rem] flex justify-between items-center shadow-lg mx-2">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-orange-100 rounded-2xl cartoon-border flex items-center justify-center text-2xl">👨‍🌾</div>
                            <div>
                                <div className="bg-white px-3 py-1 rounded-xl cartoon-border flex items-center gap-2">
                                    <span className="w-5 h-5 bg-blue-400 rounded-full text-[10px] text-white font-bold text-center leading-5">T</span>
                                    <span className="font-black text-lg">{balance.toFixed(4)}</span>
                                </div>
                                <div className={`text-xs text-gray-500 mt-1 flex items-center gap-1 ${animateMilk ? 'milk-icon' : ''}`}>
                                    🥛 {inventory.milk.toFixed(1)}L Milk
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    <main className="p-4 max-w-4xl mx-auto space-y-6">
                        <nav className="flex flex-wrap gap-2 bg-white/50 p-2 rounded-[2rem] cartoon-border justify-center">
                            {tabs.map(t => (<button key={t} onClick={() => { setPage(t); sm.play('switch'); }} className={`px-4 py-2 rounded-[1.5rem] font-bold capitalize transition-all ${page === t ? 'bg-orange-500 text-white cartoon-border' : 'text-gray-500 bg-white'}`}>{tabNames[t]}</button>))}
                        </nav>
                        
                        {page === 'farm' && (
                            <div className="space-y-4">
                                <canvas ref={canvasRef} className="w-full rounded-2xl cartoon-border" onClick={handleFarmClick} />
                                <div className="cartoon-card bg-gradient-to-r from-purple-100 via-pink-100 to-purple-100">
                                    <div className="flex justify-between items-center mb-3 flex-wrap gap-2">
                                        <h3 className="font-black text-xl flex items-center gap-2"><span className="text-2xl">🥛</span> Collect Milk</h3>
                                        {cooldown > 0 && <span className="countdown-timer">⏰ {formatTime(cooldown)}</span>}
                                    </div>
                                    <div className="text-center mb-3">
                                        <p className="text-lg font-bold text-purple-700">🥛 Base: 20L + Cows: {cows.reduce((t,c)=>t+COW_BREEDS[c.breed].rate,0)}L = {totalMilkPerCollection} L/collection</p>
                                        <p className="text-xs text-gray-600">🐄 You have {cows.length} cows! Each cow adds production.</p>
                                    </div>
                                    <button onClick={handleMilkCollect} disabled={cooldown > 0 || isCollecting} className={`cartoon-button w-full ${cooldown > 0 ? 'bg-gray-500' : 'bg-purple-500'} text-lg py-4`}>
                                        {isCollecting ? "📺 Loading Ad..." : cooldown > 0 ? "⏳ Wait for Cooldown" : `📺 Watch Ad & Get ${totalMilkPerCollection} Milk`}
                                    </button>
                                    <p className="text-xs text-center text-gray-600 mt-3">Watch ad to collect milk. Available every 60 minutes! Buy cows to increase milk!</p>
                                </div>
                                <div className="cartoon-card bg-green-50">
                                    <h3 className="font-black text-lg mb-2">🌾 Resources</h3>
                                    <p>🌱 Seeds: {inventory.seeds}</p>
                                    <p>🌾 Rice: {inventory.rice}</p>
                                    <div className="grid grid-cols-2 gap-2 mt-3">
                                        <button onClick={() => { if(inventory.rice >= 30) { setInventory(prev=>({...prev, rice: prev.rice-30})); setBalance(prev=>prev+0.01); showToast("Sold 30 Rice for 0.01 TON!"); } else showToast("Need 30 Rice"); }} className="bg-orange-500 text-white px-3 py-2 rounded-xl font-bold">Sell 30 Rice → 0.01 T</button>
                                        <button onClick={() => { if(inventory.seeds >= 5) { setInventory(prev=>({...prev, seeds: prev.seeds-5, rice: prev.rice+8})); showToast("5 Seeds → 8 Rice"); } else showToast("Need 5 seeds"); }} className="bg-green-600 text-white px-3 py-2 rounded-xl font-bold">5 Seeds → 8 Rice</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {page === 'shop' && (
                            <div className="space-y-4">
                                <div className="cartoon-card flex justify-between items-center">
                                    <div><div className="text-3xl">🌱</div><h4 className="font-bold">Rice Seeds (10)</h4></div>
                                    <button onClick={() => { if(balance >= 0.05) { setBalance(prev=>prev-0.05); setInventory(prev=>({...prev, seeds: prev.seeds+10})); sm.play('buy'); showToast("Bought 10 seeds!"); } else showToast("Need 0.05 TON"); }} className="cartoon-button bg-green-500">0.05 T</button>
                                </div>
                                {Object.entries(COW_BREEDS).map(([name, info]) => (
                                    <div key={name} className="cartoon-card flex justify-between items-center">
                                        <div><div className="text-4xl">🐄</div><h4 className="font-bold text-lg">{name}</h4><p className="text-xs">{info.rate}L/collection • {info.desc}</p></div>
                                        <button onClick={() => buyCow(name, info)} className="cartoon-button bg-orange-500">{info.price} T</button>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {page === 'convert' && (
                            <div className="cartoon-card text-center space-y-4">
                                <h2 className="font-black text-2xl">🔄 Milk to TON</h2>
                                <div className="bg-white p-4 rounded-2xl cartoon-border"><p className="text-3xl font-bold">{inventory.milk.toFixed(1)} L Milk</p></div>
                                <p className="text-sm">100 Milk = 0.03 TON</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => convertMilk(100)} className="cartoon-button bg-green-500">Convert 100L</button>
                                    <button onClick={() => convertMilk(500)} className="cartoon-button bg-green-600">Convert 500L</button>
                                    <button onClick={() => convertMilk(1000)} className="cartoon-button bg-green-700">Convert 1000L</button>
                                    <button onClick={() => convertMilk(Math.floor(inventory.milk))} className="cartoon-button bg-orange-500">Convert All</button>
                                </div>
                            </div>
                        )}
                        
                        {page === 'tasks' && (
                            <div className="grass-field">
                                <div className="big-cow mb-4">🐄</div>
                                <div className="cartoon-card bg-white/90 relative z-10">
                                    <h2 className="font-black text-2xl">📋 Earn Free TON</h2>
                                    <div className="bg-white p-4 rounded-2xl cartoon-border flex justify-between items-center mt-4">
                                        <div>
                                            <span>📢 Join Telegram Channel</span>
                                            {taskCompleted && <span className="task-completed ml-2">✓ Completed</span>}
                                        </div>
                                        <button onClick={handleTask} disabled={taskCompleted} className={`cartoon-button ${taskCompleted ? 'bg-gray-500' : 'bg-blue-500'} text-sm`}>
                                            {taskCompleted ? "Reward Claimed" : "+0.005 T"}
                                        </button>
                                    </div>
                                    <p className="text-xs text-center text-gray-500 mt-4">⚠️ One-time reward only! You can only claim this once.</p>
                                </div>
                                {[...Array(12)].map((_, i) => (
                                    <div key={i} className="grass-blade" style={{ left: `${(i * 8) + 2}%`, bottom: '0', height: `${20 + (i % 15)}px`, animationDelay: `${i * 0.15}s`, width: '3px' }}></div>
                                ))}
                            </div>
                        )}
                        
                        {page === 'referral' && (
                            <div className="cartoon-card space-y-4">
                                <h2 className="font-black text-2xl">👥 Invite Friends</h2>
                                <div className="bg-orange-100 p-3 rounded-xl text-center font-bold">✨ You earn 5% of referrals' income! ✨</div>
                                <div className="bg-white p-4 rounded-2xl text-center"><p className="text-xl font-bold">{referralEarnings.toFixed(4)} TON earned</p></div>
                                <button onClick={handleRefer} className="cartoon-button w-full bg-green-500 py-4">🔗 Invite Now</button>
                                <button onClick={handleSupport} className="cartoon-button w-full bg-red-500">🛟 Support Team</button>
                            </div>
                        )}
                        
                        {page === 'deposit' && (
                            <div className="cartoon-card space-y-4">
                                <h2 className="font-black text-2xl">💎 Deposit 1 TON</h2>
                                <div className="bg-blue-50 p-3 rounded-xl text-center break-all">
                                    <p className="font-bold">Send exactly 1 TON to:</p>
                                    <div className="flex items-center gap-2 mt-2 justify-center">
                                        <p className="text-xs font-mono break-all flex-1">{DEPOSIT_ADDRESS}</p>
                                        <button onClick={copyAddress} className="bg-blue-500 text-white p-2 rounded-xl hover:bg-blue-600 transition-all copy-btn"><i data-lucide="copy" className="w-4 h-4"></i></button>
                                    </div>
                                    {copied && <span className="text-green-500 text-xs mt-1 block">Copied!</span>}
                                </div>
                                
                                {depositStep === 'form' && (
                                    <>
                                        <input id="telegramUsername" type="text" placeholder="Your Telegram Username (e.g., @username)" className="w-full p-3 rounded-xl cartoon-border" />
                                        <input id="depositAddr" type="text" placeholder="Your TON Wallet Address" className="w-full p-3 rounded-xl cartoon-border" />
                                        <button onClick={startDepositRequest} className="cartoon-button w-full bg-purple-500">Request Deposit (1 TON)</button>
                                    </>
                                )}
                                
                                {depositStep === 'waiting' && (
                                    <div className="waiting-message">
                                        <div className="text-4xl mb-2">⏳</div>
                                        <p className="font-bold text-lg">Your request has been sent!</p>
                                        <p className="text-sm mt-2">Telegram: @{pendingDepositInfo?.telegramUsername}</p>
                                        <p className="text-xs break-all">TON: {pendingDepositInfo?.tonAddress?.substring(0, 20)}...</p>
                                        <div className="bg-white p-3 rounded-xl mt-4">
                                            <p className="text-sm font-bold">📱 Telegram Notification</p>
                                            <p className="text-xs">We will send your deposit code via Telegram very soon!</p>
                                            <p className="text-xs mt-2">Please wait for the code, then click below.</p>
                                        </div>
                                        <button onClick={goToCodeEntry} className="cartoon-button w-full bg-green-500 mt-4">I Have Received the Code</button>
                                        <button onClick={() => setDepositStep('form')} className="cartoon-button w-full bg-gray-500 mt-2">Back</button>
                                    </div>
                                )}
                                
                                {depositStep === 'code' && (
                                    <>
                                        <div className="bg-yellow-50 p-3 rounded-xl text-center">
                                            <p className="text-sm font-bold">📝 Enter Your Deposit Code</p>
                                            <p className="text-xs mt-1">Check your Telegram for the code sent by admin</p>
                                        </div>
                                        <input id="depositCode" type="text" placeholder="Enter Deposit Code" className="w-full p-3 rounded-xl cartoon-border" />
                                        <button onClick={redeemDepositCode} className="cartoon-button w-full bg-green-500">Redeem Code & Add 1 TON</button>
                                        <button onClick={() => setDepositStep('form')} className="cartoon-button w-full bg-gray-500">Cancel</button>
                                    </>
                                )}
                            </div>
                        )}
                        
                        {page === 'wallet' && (
                            <div className="cartoon-card space-y-4">
                                {totalWithdrawn >= 1 && referralEarnings === 0 && (<div className="warning-banner">⚠️ Need 1 referral for 2nd withdrawal! Go to Referral page.</div>)}
                                <div className="text-center"><h3 className="text-4xl font-black">{balance.toFixed(4)}</h3><p className="text-sm">Available TON</p></div>
                                <input id="withdrawAddr" type="text" placeholder="TON Wallet Address" className="w-full p-3 rounded-xl cartoon-border" />
                                <input id="withdrawAmount" type="number" placeholder="Amount (min 0.05)" step="0.01" className="w-full p-3 rounded-xl cartoon-border" />
                                <button onClick={handleWithdraw} className="cartoon-button w-full bg-green-500 py-4">Withdraw</button>
                                <p className="text-xs text-center">Min: 0.05 TON | 2nd+ withdrawal needs 1 referral</p>
                            </div>
                        )}
                    </main>
                    
                    {toast && <div className="toast-notification">{toast}</div>}
                    <footer className="fixed bottom-0 w-full p-2 text-center text-[10px] opacity-50 bg-white">Rice Farm Tycoon • Tap cows to feed • Click ground to plant seeds • Auto Ads Every 35s</footer>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 5100);
    </script>
</body>
</html>
